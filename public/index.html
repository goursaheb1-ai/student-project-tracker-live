<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Project Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Student Project Tracker</h1>
        <p style="font-size: 0.9rem; line-height: 1.4; margin-top: 0.25rem; color: #4b5563;">
            Shiv Raj Gour<br>
            ECM E<br>
            R25EP046
        </p>
        <p>Track our electronics project ideas.</p>
    </header>

    <main>
        <section aria-labelledby="form-title">
            <h2 id="form-title">Add Project</h2>
            <form id="project-form">
                <div>
                    <label for="name">Project Name</label>
                    <input type="text" id="name" name="name" required maxlength="80">
                </div>

                <div>
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="Planned">Planned</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>

                <div>
                    <button id="save-button" type="submit">Save Project</button>
                    <button id="cancel-button" type="button" hidden>Cancel</button>
                </div>
            </form>
        </section>

        <p id="message" role="status" aria-live="polite"></p>

        <section aria-labelledby="list-title">
            <h2 id="list-title">Project List</h2>
            <p id="empty-state">No projects added yet.</p>
            <ul id="project-list"></ul>
        </section>
    </main>
</body>

</html>
